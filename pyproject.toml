[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "metroplot"
version = "0.1.0"
description = "Subway-style pipeline diagrams for matplotlib"
requires-python = ">=3.10"
dependencies = ["matplotlib"]

[project.scripts]
metroplot = "cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
